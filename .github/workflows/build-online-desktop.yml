name: Build Send Mail Now Online Desktop Installer

on:
  push:
    branches:
      - online-saas
    paths:
      - 'desktop-online/**'
      - '.github/workflows/build-online-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-online
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Send-Mail-Now-Online-Windows-Installer
          path: desktop-online/release/*.exe
          if-no-files-found: error
          retention-days: 14
