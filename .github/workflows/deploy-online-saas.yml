name: Deploy Send Mail Now Online Workspace

on:
  push:
    branches:
      - online-saas
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: send-mail-now-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate browser JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("Inline module script not found")
          Path("/tmp/send-mail-now.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/send-mail-now.mjs
      - name: Prepare static site
        run: |
          mkdir site
          cp index.html site/index.html
          cp vercel.json site/vercel.json
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
